# local dev database, throwaway credentials
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: papertrader
      POSTGRES_USER: papertrader
      POSTGRES_PASSWORD: papertrader
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrader -d papertrader"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
