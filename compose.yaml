# Local demo only: no authentication. Bind services to loopback.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: papertrader
      POSTGRES_USER: papertrader
      POSTGRES_PASSWORD: papertrader
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrader -d papertrader"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    profiles: [app]
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/papertrader
      DB_USERNAME: papertrader
      DB_PASSWORD: papertrader
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      FEED_MODE: ${FEED_MODE:-demo}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FEED_INTERVAL_MS: ${FEED_INTERVAL_MS:-15000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
volumes:
  postgres-data:
