spring:
  application:
    name: paper-trader
  datasource:
    # only used when running outside compose support, e.g. the packaged jar
    url: ${DB_URL:jdbc:postgresql://localhost:5432/papertrader}
    username: ${DB_USERNAME:papertrader}
    password: ${DB_PASSWORD:papertrader}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # flyway owns the schema
  docker:
    compose:
      lifecycle-management: start-only # leave postgres up between runs

management:
  endpoints:
    web:
      exposure:
        include: health,info
