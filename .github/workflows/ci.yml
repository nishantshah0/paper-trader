name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend integration tests (Postgres Testcontainers)
        run: bash mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Validate Compose configuration
        run: docker compose --profile app config --quiet
      - name: Start packaged application
        run: docker compose --profile app up --build -d --wait
      - name: Browser and WebSocket integration tests
        run: npm test
        working-directory: frontend
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          retention-days: 7
          path: |
            target/surefire-reports
            frontend/test-results
      - name: Stop containers
        if: always()
        run: docker compose --profile app down
