name: Bug report
description: Report a reproducible problem with the simulator.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the actual behavior. Do not include credentials or private data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the terminal…"
    validations:
      required: true
  - type: dropdown
    id: feed
    attributes:
      label: Quote mode
      options:
        - Demo
        - Static
        - Finnhub
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Docker or local development, and relevant error output.
