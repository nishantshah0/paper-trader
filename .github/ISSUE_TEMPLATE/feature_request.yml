name: Feature request
description: Propose an improvement to the practice trading workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user workflow that needs improvement.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed behavior
      description: Explain what should happen and any alternatives you considered.
    validations:
      required: true
